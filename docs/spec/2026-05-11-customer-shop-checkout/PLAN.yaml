# -----------------------------------------------------------------------------
# Stack-adapted layering
# -----------------------------------------------------------------------------
# Default kitflow layering (Bluebird: src/types → src/services → src/store → hooks
# → components → pages) is adapted to this codebase which is:
#   - Next.js 16 App Router (file-based routing — no `src/routes/route.ts`)
#   - No axios; uses native fetch + Server Components/Server Actions/Route Handlers
#     → no `src/utils/axiosInstance.ts` task
#   - No Zustand; client state is React Context (cart) + URL state (filters)
#   - Root-level `app/`, `components/`, `lib/`, `prisma/`, `types/` (no `src/`)
#   - **No test runner currently configured.** A Layer-0 task installs Vitest +
#     RTL + setup so paired test tasks (template-required) become runnable.
#     If the user decides to defer tests, they can mark all `type: test` tasks
#     skipped during /kitflow:implement.
# -----------------------------------------------------------------------------

layers:
  - L0_foundation   # schema, types, test infra
  - L1_libs         # server-side helpers (auth, midtrans, email, cart, validators)
  - L2_ui_primitives # missing shadcn primitives (input/select/sheet/toaster)
  - L3_api          # Next.js route handlers under app/api/
  - L4_client_state # React Context provider + hooks (cart, filters)
  - L5_components   # Shop / Cart / Checkout / Account / Admin components
  - L6_pages        # App Router pages
  - L7_integration  # cross-cutting modifications to existing files

